services:
  - type: web
    name: edadapt-backend
    runtime: docker
    repo: https://github.com/vuchidigopalreddy9449-rgb/EduAdapt-backend.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: PGHOST
        fromDatabase:
          name: edadapt-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: edadapt-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: edadapt-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: edadapt-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: edadapt-db
          property: password
      - key: FRONTEND_URL
        value: https://edadapt-frontend.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

  - type: web
    name: edadapt-frontend
    runtime: docker
    repo: https://github.com/vuchidigopalreddy9449-rgb/EduAdapt-frontend.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_URL
        fromService:
          type: web
          name: edadapt-backend
          envVarKey: RENDER_EXTERNAL_URL
